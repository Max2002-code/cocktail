<div class="main">

  <div class="report-action-container">

    <div class="report-action-header">
      <h2 class="action-bar__title">Report</h2>

      <div class="report-action-bar__controls">
        <input type="text" class="report-action-bar__search" placeholder="Nome" [(ngModel)]="search.name" (keydown.enter)="getSearch()"/>
        <button class="report-action-bar__btn" (click)="getSearch()">Cerca</button>
      </div>
    </div>

    <div class="dates">
      <button (click)="search.name = null; getSearch()">Totali ({{ totals }})</button>
      <div *ngFor="let date of dates" class="date">
        <button (click)="search.name = date; getSearch()" *ngIf="date === todayStr">Oggi ({{ counts[date] || 0 }})</button>
        <button (click)="search.name = date; getSearch()" *ngIf="date!== todayStr" >{{ date }} ({{ counts[date] || 0 }})</button>
      </div>
    </div>

  </div>


  <div class="card">
  <div class="card-content">

    <ngx-datatable #table class="report-datatable-container" [limit]="rows.per_page" [count]="rows.total" [externalPaging]="true"
        [offset]="rows.page-1" (page)="datatablePage($event)" [columnMode]="ColumnMode.force" [headerHeight]="50"
        [footerHeight]="50" rowHeight="auto" [rows]="rows.results" [scrollbarH]="true" [selected]="selected" (select)="onSelect($event)"
        [selectionType]="SelectionType.checkbox" [selectAllRowsOnPage]="false">

      <ngx-datatable-column name="Nome" prop="nome" >
        <ng-template let-row="row" let-name="value" ngx-datatable-cell-template>
          <span *ngIf="row.name">{{ row.name }}</span>
        </ng-template>
      </ngx-datatable-column>

      <ngx-datatable-column name="Progressivo" prop="progressivo" >
        <ng-template let-row="row" let-name="value" ngx-datatable-cell-template>
          <span *ngIf="row.progressivo">{{ row.progressivo }}</span>
        </ng-template>
      </ngx-datatable-column>

      <ngx-datatable-column name="Data di metadatazione" prop="date_metadated" >
        <ng-template let-row="row" let-name="value" ngx-datatable-cell-template>
          <span *ngIf="row.date_metadated">{{ row.date_metadated | date:'yyyy-MM-dd' }}</span>
        </ng-template>
      </ngx-datatable-column>

      <ngx-datatable-footer *ngIf="true">
        <ng-template
          ngx-datatable-footer-template
          let-rowCount="rowCount"
          let-pageSize="pageSize"
          let-selectedCount="selectedCount"
          let-curPage="curPage"
          let-offset="offset"
        >
          <datatable-pager
            [pagerLeftArrowIcon]="'datatable-icon-prev'" 
            [pagerPreviousIcon]="'datatable-icon-left'"
            [pagerNextIcon]="'datatable-icon-right'"
            [pagerRightArrowIcon]="'datatable-icon-next'"
            [page]="curPage"
            [size]="pageSize"
            [count]="rowCount"
            [hidden]="!((rowCount / pageSize) > 1)"
            (change)="user.onFooterPage($event)">
          </datatable-pager>
        </ng-template>
      </ngx-datatable-footer>

    </ngx-datatable>

  </div>
</div>

    
</div>
